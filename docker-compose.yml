# Settings (including the MQTT password) go in a .env file next to this file,
# see .env.example. The .env file is git-ignored.

services:
  shelly-tnh-to-prom:
    image: ${IMAGE:-ghcr.io/ap-andersson/shelly-tnh-to-prom:latest}
    container_name: shelly-tnh-to-prom
    restart: unless-stopped
    ports:
      - ${HOST_PORT:-8888}:1234
    environment:
      MQTT_ENDPOINT: ${MQTT_ENDPOINT:?set MQTT_ENDPOINT in .env}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:?set MQTT_TOPIC_FILTER in .env}
      PRINT_ALL_MSGS: ${PRINT_ALL_MSGS:-false}
